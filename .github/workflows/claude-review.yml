name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".thumbgate/**"
      - ".github/ISSUE_TEMPLATE/**"
  issue_comment:
    types: [created]
  # NOTE: `push:` trigger removed 2026-05-27 to cut Actions burn. Was
  # unbounded — fired on every push to every feature branch (~10 runs/week
  # per the audit) to render a "Claude Review Advisory" no-op for required
  # checks. PR + comment triggers cover the real review flows.

concurrency:
  # issue_comment events have undefined github.event.pull_request — fall through
  # to github.event.issue.number so per-PR isolation still holds when a comment
  # triggers the workflow. Without this, every issue_comment run shares the
  # github.ref group and they all cancel each other.
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  # Do NOT cancel in-progress reviews. A PR commonly receives several events in
  # quick succession (synchronize on rapid pushes, ready_for_review, etc). With
  # cancel-in-progress: true the running "Claude Review" / "AI Auto-Approve" jobs
  # were killed mid-flight with "Canceling since a higher priority waiting request
  # exists", so the gate reported CANCELLED on nearly every PR (#148/#152/#153/#155).
  # Letting the in-flight run finish makes the review actually complete; the group
  # still serializes runs per PR so they queue rather than pile up. (2026-06-03)
  cancel-in-progress: false

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  claude-review-push-advisory:
    name: Claude Review Advisory
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Skip advisory review on push
        run: |
          echo "Claude Review only performs PR and @claude review flows."
          echo "Push events get a green advisory noop to avoid false red checks."

  # Claude deep review for architectural and project-specific checks
  claude-review:
    name: Claude Review
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    continue-on-error: true
    runs-on: ubuntu-latest
    outputs:
      claude_ok: ${{ steps.claude_review.outcome == 'success' }}
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      id-token: write
    steps:
      - name: Pass required Claude Review check on push
        if: github.event_name == 'push'
        run: |
          echo "Claude Review runs the real review on pull_request events."
          echo "Push events get this green noop so required checks do not block PR heads."

      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request'

      - name: Claude Code Review
        id: claude_review
        if: ${{ github.event_name == 'pull_request' && env.ANTHROPIC_API_KEY != '' }}
        continue-on-error: true
        uses: anthropics/claude-code-action@ea5a04005c9fd4deed2ed803c15a64d0e6eb65d0 # v1
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          allowed_bots: 'trunk-io,dependabot[bot],github-actions[bot]'
          prompt: |
            Review this PR for the AnswerGuard app. AnswerGuard is a native
            call-screening and spam-blocking mobile app:
            - Android: Kotlin + Jetpack Compose (native-android/)
              Package: com.igorganapolsky.answerguard
            - iOS: Swift + SwiftUI (native-ios/)
              Bundle ID: com.igorganapolsky.answerguard
            - CI/CD: GitHub Actions (.github/workflows/)
            - Analytics: PostHog (events defined in
              native-android/app/src/main/java/com/igorganapolsky/answerguard/analytics/AnalyticsService.kt)

            CRITICAL CHECKS (fail the review if violated):
            1. No secrets, API keys, credentials, or google-services.json in code
            2. No hardcoded colors — use theme constants
            3. Named exports only (no default exports in shared code)
            4. Kotlin: no !! (non-null assertions) without justification
            5. Swift: no force-unwraps without justification
            6. PostHog event names must match AnalyticsEvents constants — never
               hardcode event strings outside that file. Adding a new event
               without updating the unit test in AnalyticsEventsTest.kt is a bug.

            CALL-SCREENING DOMAIN CHECKS:
            - Android CallScreeningService implementations must not block on the
              main thread; the OS gives them a short deadline.
            - Permissions (READ_PHONE_STATE, READ_CONTACTS, ROLE_CALL_SCREENING)
              must be requested through the documented flows.
            - iOS CallKit / Call Directory Extension updates must reload the
              extension after spam DB writes.
            - Never log raw phone numbers or contact PII in production builds.

            ARCHITECTURE CHECKS:
            - Android follows MVVM with Compose + Hilt
            - iOS follows SwiftUI + Observable patterns
            - Shared logic should not be duplicated across platforms unnecessarily

            SECURITY CHECKS:
            - No .env files, keystores, or provisioning profiles committed
            - No hardcoded URLs to internal/staging services
            - Proper input validation at system boundaries (especially phone
              numbers from telephony callbacks)

            Output your review as a structured PR review:
            - Start with overall assessment (APPROVE, REQUEST_CHANGES, or COMMENT)
            - List specific issues with file:line references
            - Provide fix suggestions for each issue
          claude_args: '--max-turns 10'

      - name: Advisory mode notice when secret is unavailable
        if: ${{ github.event_name == 'pull_request' && env.ANTHROPIC_API_KEY == '' }}
        run: |
          echo "ANTHROPIC_API_KEY is not available for this run."
          echo "Claude Review remains advisory and non-blocking."

      - name: Warn when Claude review crashes
        if: github.event_name == 'pull_request' && steps.claude_review.outcome != 'success'
        run: |
          echo "Claude review action failed/crashed; leaving non-blocking warning."

  # Auto-approve after Claude review passes (satisfies required 1 approval)
  ai-auto-approve:
    name: AI Auto-Approve
    needs: claude-review
    if: |
      github.event_name == 'pull_request' &&
      needs.claude-review.outputs.claude_ok == 'true' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Auto-approve PR
        continue-on-error: true
        uses: hmarr/auto-approve-action@f0939ea97e9205ef24d872e76833fa908a770363 # v4.0.0
        with:
          review-message: "Auto-approved: Claude AI review passed, all CI checks green."

  # On-demand Claude assist via @claude mention
  claude-assist:
    name: Claude Assist
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Claude Code Assist
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        uses: anthropics/claude-code-action@ea5a04005c9fd4deed2ed803c15a64d0e6eb65d0 # v1
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: 'trunk-io,dependabot[bot],github-actions[bot]'
          prompt: |
            A reviewer mentioned @claude with the following comment:

            ${{ github.event.comment.body }}

            Context: This is a native mobile app (AnswerGuard, a call-screening
            and spam-blocking app) with:
            - Android: Kotlin + Jetpack Compose (native-android/)
            - iOS: Swift + SwiftUI (native-ios/)
            - Package / Bundle ID: com.igorganapolsky.answerguard

            Respond helpfully to their request. If they're asking for code changes,
            explain what needs to be done and where. Be specific with file paths.
          claude_args: |
            --max-turns 5
            --setting-sources user

      - name: Advisory mode notice when secret is unavailable
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: |
          echo "ANTHROPIC_API_KEY is not available for this run."
          echo "Claude Assist remains advisory and non-blocking."
