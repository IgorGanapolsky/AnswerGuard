name: ASC Ground Truth

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyjwt==2.11.0 cryptography==46.0.5 requests==2.32.5

      - name: ASC diagnostics
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from scripts.asc_client import ASCClient

          client = ASCClient.from_env()

          print("\n--- APPS ---")
          apps = client.get("/apps", params={"filter[bundleId]": "com.igorganapolsky.answerguard", "limit": "10"})
          for app in apps.get("data", []):
              attrs = app.get("attributes", {}) or {}
              print(f"App: {attrs.get('name', '?')} | bundleId: {attrs.get('bundleId', '?')} | id: {app.get('id', '?')}")

          print("\n--- TEAM MEMBERS ---")
          users = client.get("/users", params={"limit": "200"})
          for user in users.get("data", []):
              attrs = user.get("attributes", {}) or {}
              print(f"Member: {attrs.get('username', '?')} | Roles: {attrs.get('roles', [])}")

          print("\n--- PENDING INVITES ---")
          invites = client.get("/userInvitations", params={"limit": "200"})
          for invite in invites.get("data", []):
              attrs = invite.get("attributes", {}) or {}
              print(f"Pending: {attrs.get('email', '?')}")
          PY
