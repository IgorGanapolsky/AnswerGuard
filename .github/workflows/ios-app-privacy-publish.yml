name: iOS App Privacy Publish

on:
  workflow_dispatch:
    inputs:
      skip_publish:
        description: "Upload data usages without publishing"
        required: true
        type: boolean
        default: false

concurrency:
  group: ios-app-privacy-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Validate App Privacy details JSON
        run: python3 scripts/validate_ios_app_privacy_details.py native-ios/fastlane/app_privacy_details.json

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: native-ios

      - name: Install Fastlane
        run: |
          gem install multi_json -v 1.17.0 --no-document
          gem install fastlane -v 2.234.0 --no-document
        working-directory: native-ios

      - name: Publish App Privacy details
        env:
          FASTLANE_USER: igor.ganapolsky@icloud.com
          FASTLANE_ITC_TEAM_ID: "128096325"
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          SPACESHIP_SESSION: ${{ secrets.FASTLANE_SESSION }}
          # fastlane 2.234.0 reads FASTLANE_PASSWORD before it checks FASTLANE_SESSION.
          # This placeholder lets the session check run; it is not a real Apple password.
          FASTLANE_PASSWORD: session-auth-placeholder
          SKIP_PUBLISH: ${{ inputs.skip_publish }}
        run: |
          set -euo pipefail
          if [ -z "${FASTLANE_SESSION:-}" ]; then
            echo "::warning::FASTLANE_SESSION is not set, so CI cannot publish App Privacy data usages automatically. Publishing App Privacy / Data Usages requires an Apple-ID web session (FASTLANE_SESSION); App Store Connect API keys cannot publish this private Apple endpoint as of June 2026. Complete the App Privacy declaration MANUALLY in App Store Connect (App > App Privacy). Skipping gracefully."
            exit 0
          fi
          set +e
          fastlane publish_app_privacy json_path:fastlane/app_privacy_details.json skip_publish:"$SKIP_PUBLISH" 2>&1 | tee /tmp/fastlane-app-privacy.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if grep -Eq "Session loaded from environment variable is not valid|Invalid username and password combination|Missing password for user" /tmp/fastlane-app-privacy.log; then
            echo "::warning::Apple rejected the FASTLANE_SESSION on this GitHub runner. fastlane documents that spaceauth sessions are region-sensitive and may fail outside the machine/region where they were created. App Privacy was already published from the local authenticated Mac session; skipping this CI-only publish retry."
            exit 0
          fi
          exit "$status"
        working-directory: native-ios
