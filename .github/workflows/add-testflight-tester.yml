name: Add TestFlight Tester

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Tester email address"
        required: true
        type: string
      first_name:
        description: "Tester first name"
        required: false
        type: string
        default: ""
      last_name:
        description: "Tester last name"
        required: false
        type: string
        default: ""
      group:
        description: "Beta group name"
        required: false
        type: string
        default: "Internal Testers"

permissions:
  contents: read

jobs:
  add-tester:
    name: Add Tester to TestFlight
    runs-on: ubuntu-latest
    environment: testflight-signoff
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install pyjwt==2.11.0 cryptography==46.0.5 requests==2.32.5

      - name: Write App Store Connect key
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$KEY_PATH"
          python scripts/normalize_pem.py "$KEY_PATH"

      - name: Add tester to TestFlight group
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY_PATH: ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
          TESTER_EMAIL: ${{ inputs.email }}
          TESTER_FIRST_NAME: ${{ inputs.first_name }}
          TESTER_LAST_NAME: ${{ inputs.last_name }}
          TESTER_GROUP: ${{ inputs.group }}
        run: |
          python scripts/asc_add_tester.py \
            --email "$TESTER_EMAIL" \
            --first-name "$TESTER_FIRST_NAME" \
            --last-name "$TESTER_LAST_NAME" \
            --group "$TESTER_GROUP"
