name: Native App Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to release'
        type: choice
        options:
          - ios
          - android
          - both
        required: true
        default: 'both'
      android_track:
        description: 'Android only: Google Play track to publish to'
        type: choice
        options:
          - production
          - beta
          - alpha
        required: false
        default: 'production'
      submit_review:
        description: 'iOS only: submit the App Store version for App Review after verification'
        # `type: boolean` can be unreliable when dispatched via `gh workflow run -f submit_review=true`
        # (we've observed the `ios-submit-review` job being skipped). Use a string choice so UI/CLI/API
        # always pass consistent values.
        type: choice
        options:
          - 'false'
          - 'true'
        required: false
        default: 'false'
      regenerate_signing:
        description: 'iOS only: one-shot — let match mint a fresh distribution cert when the stored one was revoked on Apple. Leave false for normal releases.'
        type: choice
        options:
          - 'false'
          - 'true'
        required: false
        default: 'false'
      confirm_ios_only_release:
        description: 'Set true only if you intentionally skip Android on a release/v* branch (platform=ios)'
        type: choice
        options:
          - 'false'
          - 'true'
        required: false
        default: 'false'
      skip_internal_signoff:
        description: 'Deprecated/disabled. Releases must have TestFlight/Firebase internal proof on the exact SHA.'
        type: choice
        options:
          - 'false'
          - 'true'
        required: false
        default: 'false'
      skip_production_signoff:
        description: 'Waive production-signoff environment (scheduled monthly release only)'
        type: choice
        options:
          - 'false'
          - 'true'
        required: false
        default: 'false'

concurrency:
  group: mobile-release-pipeline-${{ github.ref_name }}-${{ inputs.platform || 'both' }}
  cancel-in-progress: false

jobs:
  release-intent-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enforce release-branch intent (avoid accidental Android skip)
        env:
          GITHUB_REF: ${{ github.ref }}
          RELEASE_INTENT_PLATFORM: ${{ inputs.platform }}
          RELEASE_INTENT_CONFIRM_IOS_ONLY: ${{ inputs.confirm_ios_only_release }}
        run: python3 scripts/release_intent_gate.py

  internal-proof-or-waive:
    needs: [release-intent-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Require internal signoff statuses (unless waived)
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_INTERNAL: ${{ inputs.skip_internal_signoff }}
          RELEASE_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          if [[ "${SKIP_INTERNAL}" == "true" ]]; then
            echo "❌ Internal artifact proof cannot be waived for production release."
            echo "Every release must have current internal-signoff/testflight and/or internal-signoff/firebase statuses on the exact release SHA."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" > /tmp/internal-signoff-status.json
          python3 scripts/internal_signoff_gate.py \
            --platform "$RELEASE_PLATFORM" \
            --statuses-json /tmp/internal-signoff-status.json

  require-production-signoff:
    needs: [release-intent-gate, internal-proof-or-waive]
    if: ${{ inputs.skip_production_signoff != 'true' }}
    runs-on: ubuntu-latest
    environment: production-signoff
    steps:
      - name: Await fresh CEO production release approval
        run: echo "Fresh production signoff approved for ${GITHUB_SHA}"

  production-signoff-waive:
    needs: [release-intent-gate, internal-proof-or-waive]
    if: ${{ inputs.skip_production_signoff == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Waive production-signoff (automated monthly path)
        run: echo "::notice::production-signoff waived (skip_production_signoff=true)"

  ios-testflight:
    needs:
      - release-intent-gate
      - internal-proof-or-waive
      - require-production-signoff
      - production-signoff-waive
    if: >-
      (inputs.platform == 'ios' || inputs.platform == 'both') &&
      always() && !cancelled() &&
      needs.release-intent-gate.result == 'success' &&
      needs.internal-proof-or-waive.result == 'success' &&
      (needs.require-production-signoff.result == 'success' || needs.production-signoff-waive.result == 'success')
    runs-on: macos-26
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Fail fast on required iOS release secrets
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          for name in APPSTORE_PRIVATE_KEY APPSTORE_KEY_ID APPSTORE_ISSUER_ID MATCH_GIT_URL MATCH_PASSWORD MATCH_GIT_BASIC_AUTHORIZATION ADMIN_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "❌ Missing required secret: $name"
              exit 1
            fi
          done

      - name: Preflight release checks (iOS)
        run: bash scripts/preflight-release.sh --platform ios --layer 1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: native-ios

      - name: Install Fastlane
        run: |
          gem install multi_json -v 1.17.0 --no-document
          gem install fastlane -v 2.234.0 --no-document
        working-directory: native-ios

      - name: Validate iOS signing secrets
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          if [ -z "$MATCH_GIT_URL" ]; then
            echo "❌ MATCH_GIT_URL secret is not set"
            exit 1
          fi
          if [ -z "$MATCH_PASSWORD" ]; then
            echo "❌ MATCH_PASSWORD secret is not set"
            exit 1
          fi
          if [ -z "$MATCH_GIT_BASIC_AUTHORIZATION" ]; then
            echo "❌ MATCH_GIT_BASIC_AUTHORIZATION secret is not set"
            exit 1
          fi

      - name: Write API key
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

      - name: Configure git credentials for match
        env:
          GIT_AUTH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GIT_AUTH_TOKEN}@github.com/".insteadOf "https://github.com/"

      # One-shot remedy for a distribution cert that was revoked on the Apple
      # Developer Portal but still lingers in match's git storage. In that state
      # `match` aborts ("Certificate ... is not available on the Developer
      # Portal") BEFORE force_for_new_certificates can mint a replacement, and
      # it will not auto-delete the dangling entry. Purging the stale cert (and
      # the appstore profiles that reference it) from storage leaves match with
      # empty distribution storage, so the next step mints a fresh cert.
      # This revokes NOTHING on Apple (the cert is already gone there) and the
      # match repo's git history retains the old files, so it is reversible.
      # Strictly gated on regenerate_signing=true; normal releases skip it.
      - name: Purge revoked distribution cert from match storage (one-shot)
        if: ${{ inputs.regenerate_signing == 'true' }}
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          git clone --depth 1 "$MATCH_GIT_URL" "$work/match-repo"
          cd "$work/match-repo"
          echo "Distribution certs currently in storage:"
          ls -la certs/distribution/ 2>/dev/null || echo "  (none)"
          if ls certs/distribution/* >/dev/null 2>&1; then
            git rm certs/distribution/*
            # Drop appstore profiles too; force_for_new_certificates regenerates
            # them bound to the fresh cert. ignore-unmatch keeps this safe if the
            # directory is absent.
            git rm -r --ignore-unmatch profiles/appstore || true
            git config user.email "ci@answerguard.app"
            git config user.name "AnswerGuard CI"
            git commit -m "chore(match): purge revoked distribution cert + appstore profiles (one-shot regen)"
            git push
            echo "✅ Purged stale distribution cert; match will mint a fresh one."
          else
            echo "No distribution certs in storage — nothing to purge."
          fi

      - name: Setup signing certificates and profiles (match)
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          # One-shot cert regeneration: only true when dispatched with
          # regenerate_signing=true. Defaults false so normal releases never
          # mint a new distribution cert.
          MATCH_FORCE_NEW_CERT: ${{ inputs.regenerate_signing || 'false' }}
        run: fastlane setup
        working-directory: native-ios

      - name: Verify App Store Connect API access
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY_PATH: ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
        run: |
          python -m pip install pyjwt==2.11.0 cryptography==46.0.5 requests==2.32.5
          python scripts/check_store_access.py --platform ios

      - name: Build and upload to TestFlight
        env:
          CI: "true"
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: fastlane beta
        working-directory: native-ios

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-ipa
          path: native-ios/AnswerGuard.ipa
          retention-days: 5

  android-device-test-gate:
    name: Android connectedDebugAndroidTest (all classes)
    needs: [release-intent-gate]
    if: >-
      (inputs.platform == 'android' || inputs.platform == 'both') &&
      needs.release-intent-gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Create dummy google-services.json for CI
        working-directory: native-android
        run: |
          cat > app/google-services.json << 'GSEOF'
          {
            "project_info": { "project_number": "000000000000", "project_id": "answerguard-ci", "storage_bucket": "answerguard-ci.appspot.com" },
            "client": [{ "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": { "package_name": "com.igorganapolsky.answerguard" } }, "api_key": [{ "current_key": "CI_PLACEHOLDER" }] }],
            "configuration_version": "1"
          }
          GSEOF

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run full connectedDebugAndroidTest suite on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -skin 1080x2340
          disable-animations: false
          emulator-boot-timeout: 300
          script: sh scripts/device-tests/ci-connected-all.sh

      - name: Upload Android release device test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-release-device-test-reports
          path: |
            native-android/app/build/reports/androidTests/connected
            native-android/app/build/outputs/androidTest-results/connected
          retention-days: 1

  android-release:
    needs:
      - release-intent-gate
      - internal-proof-or-waive
      - require-production-signoff
      - production-signoff-waive
      - android-device-test-gate
    if: >-
      (inputs.platform == 'android' || inputs.platform == 'both') &&
      always() && !cancelled() &&
      needs.release-intent-gate.result == 'success' &&
      needs.internal-proof-or-waive.result == 'success' &&
      needs.android-device-test-gate.result == 'success' &&
      (needs.require-production-signoff.result == 'success' || needs.production-signoff-waive.result == 'success')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    outputs:
      requested_track: ${{ steps.play_result.outputs.requested_track }}
      effective_track: ${{ steps.play_result.outputs.effective_track }}
      fallback_used: ${{ steps.play_result.outputs.fallback_used }}
      precondition_blocked: ${{ steps.play_result.outputs.precondition_blocked }}
      version_code: ${{ steps.play_result.outputs.version_code }}
    steps:
      - uses: actions/checkout@v7

      - name: Fail fast on required Android release secrets
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in GOOGLE_PLAY_JSON_KEY ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "❌ Missing required secret: $name"
              exit 1
            fi
          done

      - name: Preflight release checks (Android)
        run: bash scripts/preflight-release.sh --platform android --layer 1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo '{"project_info":{"project_number":"","project_id":"","storage_bucket":""},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.igorganapolsky.answerguard"}},"api_key":[{"current_key":""}]},{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000001","android_client_info":{"package_name":"com.igorganapolsky.answerguard.debug"}},"api_key":[{"current_key":""}]}]}' > app/google-services.json
          fi
        working-directory: native-android

      - name: Write Google Play service account key
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: |
          if [ -z "$GOOGLE_PLAY_JSON_KEY" ]; then
            echo "❌ GOOGLE_PLAY_JSON_KEY secret is not set"
            exit 1
          fi
          echo "$GOOGLE_PLAY_JSON_KEY" > /tmp/play-service-account.json

      - name: Verify Google Play API access
        env:
          GOOGLE_PLAY_JSON_KEY: /tmp/play-service-account.json
        run: |
          python -m pip install google-api-python-client==2.190.0 google-auth==2.48.0 google-auth-httplib2==0.3.0 google-auth-oauthlib==1.2.4 requests==2.32.5
          python scripts/check_store_access.py --platform android

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "❌ ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
          echo "✅ Keystore decoded"

      - name: Inspect upload key certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore /tmp/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" | grep -E "Alias name:|Valid from:|SHA1:|SHA-256:"

      - name: Build release AAB
        id: build_meta
        env:
          GOOGLE_PLAY_JSON_KEY: /tmp/play-service-account.json
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          set -euo pipefail
          VERSION_CODE="$(python ../scripts/compute_android_release_version_code.py \
            --service-account-json "$GOOGLE_PLAY_JSON_KEY" \
            --gradle-file app/build.gradle.kts \
            --timeout-seconds 180 \
            --request-retries 3)"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          ./gradlew -PciVersionCode="$VERSION_CODE" bundleRelease
        working-directory: native-android

      - name: Upload to Google Play (track)
        env:
          GOOGLE_PLAY_JSON_KEY: /tmp/play-service-account.json
          PLAY_TRACK: ${{ inputs.android_track }}
          PLAY_FALLBACK_TRACK: ""
          PLAY_RELEASE_STATUS: completed
          APP_REVIEW_CONTACT_EMAIL: ${{ secrets.APP_REVIEW_CONTACT_EMAIL }}
          PLAY_UPLOAD_RETRY_WINDOW_SECONDS: "10800"
          PLAY_UPLOAD_RETRY_INTERVAL_SECONDS: "300"
        run: |
          if [ ! -f "$GOOGLE_PLAY_JSON_KEY" ]; then
            echo "❌ Google Play key file not found at $GOOGLE_PLAY_JSON_KEY"
            exit 1
          fi
          pip install google-api-python-client==2.190.0 google-auth==2.48.0 google-auth-httplib2==0.3.0 google-auth-oauthlib==1.2.4
          python scripts/play_publish.py \
            --service-account-json "$GOOGLE_PLAY_JSON_KEY" \
            --package com.igorganapolsky.answerguard \
            --aab-path native-android/app/build/outputs/bundle/release/app-release.aab \
            --requested-track "$PLAY_TRACK" \
            --fallback-track "$PLAY_FALLBACK_TRACK" \
            --release-status "$PLAY_RELEASE_STATUS" \
            --retry-window-seconds "$PLAY_UPLOAD_RETRY_WINDOW_SECONDS" \
            --retry-interval-seconds "$PLAY_UPLOAD_RETRY_INTERVAL_SECONDS" \
            --result-json /tmp/play-upload-result.json \
            --error-json /tmp/play-upload-error.json

      - name: Capture Play publish result outputs
        id: play_result
        if: always()
        run: |
          REQUESTED_TRACK="${{ inputs.android_track }}"
          EFFECTIVE_TRACK="${{ inputs.android_track }}"
          FALLBACK_USED="false"
          PRECONDITION_BLOCKED="false"
          VERSION_CODE=""

          if [ -f /tmp/play-upload-result.json ]; then
            REQUESTED_TRACK="$(jq -r '.requested_track // empty' /tmp/play-upload-result.json)"
            EFFECTIVE_TRACK="$(jq -r '.effective_track // empty' /tmp/play-upload-result.json)"
            FALLBACK_USED="$(jq -r '.fallback_used // false' /tmp/play-upload-result.json)"
            PRECONDITION_BLOCKED="$(jq -r '.precondition_blocked // false' /tmp/play-upload-result.json)"
            VERSION_CODE="$(jq -r '.version_code // empty' /tmp/play-upload-result.json)"
          fi

          if [ -z "$REQUESTED_TRACK" ] || [ "$REQUESTED_TRACK" = "null" ]; then
            REQUESTED_TRACK="${{ inputs.android_track }}"
          fi
          if [ -z "$EFFECTIVE_TRACK" ] || [ "$EFFECTIVE_TRACK" = "null" ]; then
            EFFECTIVE_TRACK="$REQUESTED_TRACK"
          fi

          echo "requested_track=$REQUESTED_TRACK" >> "$GITHUB_OUTPUT"
          echo "effective_track=$EFFECTIVE_TRACK" >> "$GITHUB_OUTPUT"
          echo "fallback_used=$FALLBACK_USED" >> "$GITHUB_OUTPUT"
          echo "precondition_blocked=$PRECONDITION_BLOCKED" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "play_result requested=$REQUESTED_TRACK effective=$EFFECTIVE_TRACK version_code=$VERSION_CODE fallback_used=$FALLBACK_USED precondition_blocked=$PRECONDITION_BLOCKED"

      - name: Upload Play upload result (if any)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: play-upload-result
          path: /tmp/play-upload-result.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload Play upload error (if any)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: play-upload-error
          path: /tmp/play-upload-error.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-aab
          path: native-android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 5

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f /tmp/release.keystore /tmp/play-service-account.json

  verify-releases:
    needs: [ios-testflight, android-release]
    if: always() && (needs.ios-testflight.result == 'success' || needs.android-release.result == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-api-python-client==2.190.0 google-auth==2.48.0 pyjwt==2.11.0 cryptography==46.0.5 requests==2.32.5

      - name: Extract version info
        id: versions
        run: |
          # Android versionCode from build.gradle.kts
          VERSION_CODE=$(sed -nE 's/.*versionCode[[:space:]]*=[^0-9]*([0-9]+).*/\1/p' native-android/app/build.gradle.kts | head -1 || echo "")
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

          ANDROID_VERSION=$(python3 scripts/source_versions.py --format value --key ANDROID_VERSION_NAME)
          echo "android_version=$ANDROID_VERSION" >> "$GITHUB_OUTPUT"

          # iOS version from project.pbxproj
          IOS_VERSION=$(grep -m1 'MARKETING_VERSION' native-ios/AnswerGuard.xcodeproj/project.pbxproj | grep -oP '[\d.]+' || echo "")
          echo "ios_version=$IOS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Debug workflow inputs (no secrets)
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "inputs.platform=${{ inputs.platform }}"
          echo "inputs.android_track=${{ inputs.android_track }}"
          echo "inputs.submit_review=${{ inputs.submit_review }}"
          echo "github.event.inputs.platform=${{ github.event.inputs.platform }}"
          echo "github.event.inputs.android_track=${{ github.event.inputs.android_track }}"
          echo "github.event.inputs.submit_review=${{ github.event.inputs.submit_review }}"
          echo "github.event.inputs(json)=${{ toJSON(github.event.inputs) }}"

      - name: Determine platform flag
        id: platform
        run: |
          if [[ "${{ needs.ios-testflight.result }}" == "success" && "${{ needs.android-release.result }}" == "success" ]]; then
            echo "flag=both" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.ios-testflight.result }}" == "success" ]]; then
            echo "flag=ios" >> "$GITHUB_OUTPUT"
          else
            echo "flag=android" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine Android track (no secrets)
        id: android_track
        run: |
          TRACK="${{ needs.android-release.outputs.effective_track }}"
          if [ -n "$TRACK" ] && [ "$TRACK" != "null" ]; then
            echo "Using effective track from android-release output: $TRACK"
          else
            TRACK=$(jq -r '.inputs.android_track // ""' "$GITHUB_EVENT_PATH")
          fi
          if [ -z "$TRACK" ] || [ "$TRACK" = "null" ]; then
            TRACK="${{ inputs.android_track }}"
          fi
          if [ -z "$TRACK" ] || [ "$TRACK" = "null" ]; then
            TRACK="production"
          fi
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"
          echo "android_track=$TRACK"

      - name: Write App Store Connect key
        if: needs.ios-testflight.result == 'success'
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          echo "$APPSTORE_PRIVATE_KEY" > /tmp/appstore_key.p8

      - name: Write Google Play key
        if: needs.android-release.result == 'success'
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: |
          echo "$GOOGLE_PLAY_JSON_KEY" > /tmp/play-service-account.json

      - name: Verify releases
        env:
          GOOGLE_PLAY_JSON_KEY: /tmp/play-service-account.json
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: /tmp/appstore_key.p8
        run: |
          ARGS="--platform ${{ steps.platform.outputs.flag }} --wait --timeout 600"
          if [ "${{ needs.android-release.result }}" = "success" ]; then
            ARGS="$ARGS --track ${{ steps.android_track.outputs.track }}"
          fi
          ANDROID_VERSION_CODE="${{ needs.android-release.outputs.version_code }}"
          if [ -z "$ANDROID_VERSION_CODE" ] || [ "$ANDROID_VERSION_CODE" = "null" ]; then
            ANDROID_VERSION_CODE="${{ steps.versions.outputs.version_code }}"
          fi
          if [ -n "$ANDROID_VERSION_CODE" ]; then
            ARGS="$ARGS --version-code $ANDROID_VERSION_CODE"
          fi
          if [ -n "${{ steps.versions.outputs.ios_version }}" ]; then
            ARGS="$ARGS --version ${{ steps.versions.outputs.ios_version }}"
          fi
          if [[ "${{ steps.platform.outputs.flag }}" == "ios" || "${{ steps.platform.outputs.flag }}" == "both" ]]; then
            # Before submit_review runs, only require the uploaded TestFlight build to be VALID.
            # App Store version state is verified after submission below.
            ARGS="$ARGS --ios-scope testflight"
          fi
          python scripts/verify_release.py $ARGS

      - name: Verify public Google Play listing (production only)
        id: play_public_listing
        if: needs.android-release.result == 'success' && steps.android_track.outputs.track == 'production'
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/verify_play_public_listing.py \
            --package com.igorganapolsky.answerguard \
            --country US \
            --expected-version "${{ steps.versions.outputs.android_version }}" \
            --timeout 900 \
            --poll-interval 60 | tee /tmp/play-public-listing.txt

      - name: Warn when Play storefront propagation lags production
        if: always() && steps.play_public_listing.outcome == 'failure'
        run: |
          echo "::warning::Google Play production verified via Android Publisher API, but the public storefront has not yet shown version ${{ steps.versions.outputs.android_version }}. Inspect the play-public-listing-report artifact."

      - name: Upload Play storefront verification report
        if: always() && needs.android-release.result == 'success' && steps.android_track.outputs.track == 'production'
        uses: actions/upload-artifact@v7
        with:
          name: play-public-listing-report
          path: /tmp/play-public-listing.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f /tmp/play-service-account.json /tmp/appstore_key.p8

  ios-submit-review:
    needs: [verify-releases]
    # Run whenever verification succeeded. The explicit `always()` guard is REQUIRED: on a
    # `platform: ios` dispatch, `android-release` is skipped, and without this guard that skip
    # propagates transitively to this job (it inherits the implicit `success()` condition), so the
    # job is skipped before the gate step can run. We intentionally key only on the upstream job
    # RESULT — not on `workflow_dispatch` inputs, which have been brittle in practice — and keep the
    # privileged steps gated at runtime via the `gate` step below (which reads submit_review).
    if: ${{ always() && needs.verify-releases.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    # The ASC helper scripts use repo-root-relative imports (`from scripts.X import ...`)
    # but are invoked as `python scripts/<name>.py`, so the repo root must be on sys.path.
    # `scripts/` has no __init__.py; with the workspace on PYTHONPATH it resolves as a
    # Python 3 namespace package. Set once at job level so every python step inherits it.
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      - name: Gate submit-for-review (no secrets)
        id: gate
        env:
          VERIFY_RELEASES_RESULT: ${{ needs.verify-releases.result }}
        run: |
          set -euo pipefail
          PLATFORM=$(jq -r '.inputs.platform // ""' "$GITHUB_EVENT_PATH")
          SUBMIT_REVIEW=$(jq -r '.inputs.submit_review // ""' "$GITHUB_EVENT_PATH")

          ENABLED="false"
          if [[ "${VERIFY_RELEASES_RESULT}" == "success" && ( "$PLATFORM" == "ios" || "$PLATFORM" == "both" ) ]]; then
            if [[ "$SUBMIT_REVIEW" == "true" || "$SUBMIT_REVIEW" == "1" ]]; then
              ENABLED="true"
            fi
          fi

          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "submit_review=$SUBMIT_REVIEW" >> "$GITHUB_OUTPUT"
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          echo "gate: verify_releases_result=${VERIFY_RELEASES_RESULT} platform=$PLATFORM submit_review=$SUBMIT_REVIEW enabled=$ENABLED"

      - name: Setup Python
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies (ASC)
        if: steps.gate.outputs.enabled == 'true'
        run: pip install pyjwt==2.11.0 cryptography==46.0.5 requests==2.32.5

      - name: Extract iOS version
        if: steps.gate.outputs.enabled == 'true'
        id: versions
        run: |
          IOS_VERSION=$(grep -m1 'MARKETING_VERSION' native-ios/AnswerGuard.xcodeproj/project.pbxproj | sed -n 's/.*MARKETING_VERSION *= *\([0-9][0-9.]*\).*/\1/p' || echo "")
          if [ -z "$IOS_VERSION" ]; then
            echo "❌ Could not read iOS version from native-ios/AnswerGuard.xcodeproj/project.pbxproj"
            exit 1
          fi
          echo "ios_version=$IOS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Remove prior patch from review when shipping newer version
        if: steps.gate.outputs.enabled == 'true'
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          PREFERRED_VERSION: ${{ steps.versions.outputs.ios_version }}
        run: |
          set -euo pipefail
          IFS='.' read -r MAJ MIN PATCH <<< "$PREFERRED_VERSION"
          if [ "${PATCH:-0}" -le 0 ]; then
            echo "No prior patch to unblock for $PREFERRED_VERSION"
            exit 0
          fi
          PREV="${MAJ}.${MIN}.$((PATCH - 1))"
          STATE_JSON="$(python scripts/asc_poll_version_state.py --version "$PREV" --json 2>/dev/null)" || true
          STATE="$(echo "$STATE_JSON" | python -c 'import json,sys; print(json.loads(sys.stdin.read() or "{}").get("state","UNKNOWN"))' 2>/dev/null)" || STATE="UNKNOWN"
          echo "Prior patch $PREV state=$STATE"
          case "$STATE" in
            IN_REVIEW|WAITING_FOR_REVIEW)
              python scripts/asc_remove_from_review.py --version "$PREV" --wait --json-out /tmp/asc_unblock_prior.json
              cat /tmp/asc_unblock_prior.json
              ;;
            *)
              echo "Prior patch not blocking review queue; no removal needed."
              ;;
          esac

      - name: Resolve editable App Store version
        if: steps.gate.outputs.enabled == 'true'
        id: asc_version
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          PREFERRED_VERSION: ${{ steps.versions.outputs.ios_version }}
        run: |
          python scripts/asc_resolve_version.py \
            --preferred-version "$PREFERRED_VERSION" \
            --create-if-needed \
            --allow-review-locked-preferred \
            --json-out /tmp/asc_version.json
          SELECTED_VERSION=$(python -c 'import json; print(json.load(open("/tmp/asc_version.json"))["selected_version"])')
          SELECTED_VERSION_ID=$(python -c 'import json; print(json.load(open("/tmp/asc_version.json")).get("selected_id") or "")')
          SELECTED_STATE=$(python -c 'import json; print(json.load(open("/tmp/asc_version.json")).get("selected_state") or "")')
          REASON=$(python -c 'import json; print(json.load(open("/tmp/asc_version.json")).get("reason") or "")')
          APP_ID=$(python -c 'import json; print(json.load(open("/tmp/asc_version.json")).get("app_id") or "")')
          echo "selected_version=$SELECTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "selected_version_id=$SELECTED_VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "selected_state=$SELECTED_STATE" >> "$GITHUB_OUTPUT"
          echo "resolve_reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "Using editable App Store version: $SELECTED_VERSION (state=$SELECTED_STATE reason=$REASON)"
          if [ -z "$SELECTED_VERSION_ID" ] || [ "$SELECTED_STATE" = "UNKNOWN_409_BLOCKED" ]; then
            echo "❌ App Store version $PREFERRED_VERSION is not editable in ASC (id missing / 409 blocked)."
            echo "ios_submit_blocked=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ios_submit_blocked=false" >> "$GITHUB_OUTPUT"

      - name: Write App Store Connect key (for API)
        if: steps.gate.outputs.enabled == 'true'
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          echo "$APPSTORE_PRIVATE_KEY" > /tmp/appstore_key.p8

      - name: Check current App Store version state
        if: steps.gate.outputs.enabled == 'true'
        id: asc_state
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: /tmp/appstore_key.p8
        run: |
          STATE_JSON="$(python scripts/asc_poll_version_state.py --version "${{ steps.asc_version.outputs.selected_version }}" --json 2>/dev/null)" || true
          STATE="$(echo "$STATE_JSON" | python -c 'import json,sys; print(json.loads(sys.stdin.read()).get("state","UNKNOWN"))' 2>/dev/null)" || STATE="UNKNOWN"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "ASC version state before metadata upload: $STATE"

      - name: Setup Ruby
        if: steps.gate.outputs.enabled == 'true'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: native-ios

      - name: Install Fastlane
        if: steps.gate.outputs.enabled == 'true'
        run: |
          gem install multi_json -v 1.17.0 --no-document
          gem install fastlane -v 2.234.0 --no-document
        working-directory: native-ios

      - name: Write App Store Connect key (Fastlane convention)
        if: steps.gate.outputs.enabled == 'true'
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

      - name: Ensure App Review contact details
        if: steps.gate.outputs.enabled == 'true'
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: /tmp/appstore_key.p8
          APP_REVIEW_CONTACT_FIRST_NAME: ${{ secrets.APP_REVIEW_CONTACT_FIRST_NAME }}
          APP_REVIEW_CONTACT_LAST_NAME: ${{ secrets.APP_REVIEW_CONTACT_LAST_NAME }}
          APP_REVIEW_CONTACT_EMAIL: ${{ secrets.APP_REVIEW_CONTACT_EMAIL }}
          APP_REVIEW_CONTACT_PHONE: ${{ secrets.APP_REVIEW_CONTACT_PHONE }}
          APP_REVIEW_DEMO_ACCOUNT_REQUIRED: ${{ secrets.APP_REVIEW_DEMO_ACCOUNT_REQUIRED }}
          APP_REVIEW_DEMO_ACCOUNT_NAME: ${{ secrets.APP_REVIEW_DEMO_ACCOUNT_NAME }}
          APP_REVIEW_DEMO_ACCOUNT_PASSWORD: ${{ secrets.APP_REVIEW_DEMO_ACCOUNT_PASSWORD }}
          APP_REVIEW_NOTES: ${{ secrets.APP_REVIEW_NOTES }}
        run: |
          python scripts/asc_ensure_review_detail.py \
            --version "${{ steps.asc_version.outputs.selected_version }}"

      - name: Check current App Store version state (pre-metadata)
        if: steps.gate.outputs.enabled == 'true'
        id: asc_state_meta
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: /tmp/appstore_key.p8
          IOS_VERSION: ${{ steps.asc_version.outputs.selected_version }}
        run: |
          STATE_JSON="$(python scripts/asc_poll_version_state.py --version "$IOS_VERSION" --json 2>/dev/null)" || true
          STATE="$(echo "$STATE_JSON" | python -c 'import json,sys; print(json.loads(sys.stdin.read()).get("state","UNKNOWN"))' 2>/dev/null)" || STATE="UNKNOWN"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "ASC version state (pre-metadata): $STATE"

      - name: Upload App Store metadata/screenshots
        if: ${{ steps.gate.outputs.enabled == 'true' && steps.asc_version.outputs.ios_submit_blocked != 'true' && steps.asc_version.outputs.selected_version_id != '' && steps.asc_state_meta.outputs.state != 'READY_FOR_REVIEW' && steps.asc_state_meta.outputs.state != 'WAITING_FOR_REVIEW' && steps.asc_state_meta.outputs.state != 'IN_REVIEW' }}
        env:
          CI: "true"
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: fastlane metadata version:${{ steps.asc_version.outputs.selected_version }}
        working-directory: native-ios

      - name: Attach VALID build to editable App Store version
        if: ${{ steps.gate.outputs.enabled == 'true' && steps.asc_state.outputs.state != 'WAITING_FOR_REVIEW' && steps.asc_state.outputs.state != 'IN_REVIEW' && steps.asc_state.outputs.state != 'PENDING_DEVELOPER_RELEASE' && steps.asc_state.outputs.state != 'READY_FOR_SALE' }}
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: /tmp/appstore_key.p8
          APP_ID: ${{ steps.asc_version.outputs.app_id }}
          APP_STORE_VERSION_ID: ${{ steps.asc_version.outputs.selected_version_id }}
          IOS_VERSION: ${{ steps.asc_version.outputs.selected_version }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "❌ Missing App Store Connect app id from asc_resolve_version.py"
            exit 1
          fi
          if [ -z "$APP_STORE_VERSION_ID" ]; then
            echo "❌ Missing editable App Store version id from asc_resolve_version.py"
            exit 1
          fi
          python - <<'PY'
          import os
          from scripts.asc_client import ASCClient
          from scripts.asc_submit_for_review import attach_build, select_valid_build_id

          client = ASCClient.from_env(timeout=30)
          app_id = os.environ["APP_ID"]
          version_id = os.environ["APP_STORE_VERSION_ID"]
          marketing_version = os.environ["IOS_VERSION"]
          build_id = select_valid_build_id(client, app_id, marketing_version)
          attach_build(client, version_id, build_id)
          print(f"Attached VALID build {build_id} to App Store version {version_id}")
          PY

      - name: Verify App Store submission readiness (hard gate)
        if: steps.gate.outputs.enabled == 'true'
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: /tmp/appstore_key.p8
        run: |
          python scripts/asc_verify_ready.py \
            --version "${{ steps.asc_version.outputs.selected_version }}" \
            --json /tmp/asc_ready.json

      - name: Enforce delegation contract (submit gate)
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python scripts/delegation_contract.py \
            --operation ios_submit_for_review \
            --asc-ready-json /tmp/asc_ready.json \
            --intent "${{ steps.gate.outputs.submit_review }}" \
            --json-out /tmp/delegation_contract.json \
            --enforce

      - name: Upload readiness report
        uses: actions/upload-artifact@v7
        if: ${{ steps.gate.outputs.enabled == 'true' && always() }}
        with:
          name: asc-ready-report
          path: |
            /tmp/asc_ready.json
            /tmp/delegation_contract.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Submit for App Review (App Store)
        if: steps.gate.outputs.enabled == 'true'
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: /tmp/appstore_key.p8
          IOS_VERSION: ${{ steps.asc_version.outputs.selected_version }}
        run: |
          python scripts/asc_submit_for_review.py \
            --version "$IOS_VERSION" \
            --locale en-US \
            --attach-subscriptions \
            --wait

      - name: Verify App Store submission state
        if: steps.gate.outputs.enabled == 'true'
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: /tmp/appstore_key.p8
        run: |
          python scripts/verify_release.py \
            --platform ios \
            --version "${{ steps.asc_version.outputs.selected_version }}" \
            --wait \
            --timeout 600 \
            --ios-scope both \
            --require-appstore-submission

      - name: Upload version resolution report
        uses: actions/upload-artifact@v7
        if: ${{ steps.gate.outputs.enabled == 'true' && always() }}
        with:
          name: asc-version-resolution
          path: /tmp/asc_version.json
          retention-days: 3

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f /tmp/appstore_key.p8 /tmp/asc_ready.json /tmp/delegation_contract.json /tmp/asc_version.json

  tag-release:
    needs: [verify-releases]
    if: always() && needs.verify-releases.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from source
        id: version
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' native-android/app/build.gradle.kts | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode *= *\([0-9]*\).*/\1/p' native-android/app/build.gradle.kts | head -1)
          TAG="v${VERSION_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved: $TAG (Android code=$VERSION_CODE)"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create git tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" \
            -m "Release ${{ steps.version.outputs.tag }} (Android code=${{ steps.version.outputs.version_code }})"
          git push origin "${{ steps.version.outputs.tag }}"
          echo "✅ Created and pushed tag ${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read Android changelog if it exists
          CHANGELOG_FILE="native-android/fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.version_code }}.txt"
          NOTES=""
          if [ -f "$CHANGELOG_FILE" ]; then
            NOTES=$(cat "$CHANGELOG_FILE")
          fi

          # Read iOS release notes if available
          IOS_NOTES_FILE="native-ios/fastlane/metadata/en-US/release_notes.txt"
          if [ -f "$IOS_NOTES_FILE" ]; then
            IOS_NOTES=$(cat "$IOS_NOTES_FILE")
            if [ -n "$IOS_NOTES" ]; then
              NOTES="${NOTES}

          ### iOS
          ${IOS_NOTES}"
            fi
          fi

          if [ -z "$NOTES" ]; then
            NOTES="Release ${{ steps.version.outputs.tag }}"
          fi

          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "$NOTES"
          echo "✅ Created GitHub Release ${{ steps.version.outputs.tag }}"

  sync-main:
    needs: [tag-release]
    if: always() && needs.tag-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create PR to merge release into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.tag-release.outputs.tag || '' }}"
          BRANCH="${GITHUB_REF_NAME}"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "release: merge $BRANCH into main" \
            --body "Auto-generated PR to sync main with release $TAG" \
            || echo "PR already exists or branch is up to date"
        continue-on-error: true

      - name: Create PR to merge release back into develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore: merge $BRANCH back into develop" \
            --body "Auto-generated PR to sync develop after release" \
            || echo "PR already exists or branch is up to date"
        continue-on-error: true

  bump-develop-version:
    needs: [tag-release]
    if: always() && needs.tag-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.ADMIN_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Bump patch version on develop
        id: bump
        run: |
          TAG="${{ needs.tag-release.outputs.tag || '' }}"
          python3 scripts/bump_patch_version.py \
            --changelog-message "Bump version after $TAG release" \
            --skip-changelog
          NEW_VERSION=$(python3 scripts/source_versions.py --repo-root . --format json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["android"]["version_name"])')
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped working tree to v${NEW_VERSION} (will open PR — develop is protected)"

      - name: Open pull request for develop version bump
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "❌ ADMIN_TOKEN is required to open the post-release bump PR (direct push to develop is blocked by branch protection)."
            exit 1
          fi
          TAG="${{ needs.tag-release.outputs.tag || 'unknown' }}"
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          BRANCH="chore/bump-develop-post-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add native-android/app/build.gradle.kts \
                  native-ios/AnswerGuard.xcodeproj/project.pbxproj \
                  native-android/fastlane/metadata/android/en-US/changelogs/ \
                  native-ios/fastlane/metadata/en-US/release_notes.txt
          if git diff --cached --quiet; then
            echo "Nothing to commit — skipping PR."
            exit 0
          fi
          git commit -m "chore: bump develop to v${NEW_VERSION} after ${TAG} release [skip ci]"
          git push -u origin "$BRANCH"
          BODY_FILE="$(mktemp)"
          {
            echo "Automated post-release version bump after tag \`${TAG}\`."
            echo ""
            echo "develop rejects direct pushes; merge this PR to align develop with the next patch train."
            echo ""
            echo "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$BODY_FILE"
          gh pr create --repo "${{ github.repository }}" --base develop --head "$BRANCH" \
            --title "chore: bump develop to v${NEW_VERSION} after ${TAG}" \
            --body-file "$BODY_FILE"
          rm -f "$BODY_FILE"
          echo "✅ Opened PR for develop version bump (branch ${BRANCH})"
