name: Sonar & Gitar AI Review

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".thumbgate/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".thumbgate/**"
      - ".github/ISSUE_TEMPLATE/**"

concurrency:
  group: sonar-gitar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonar-gitar-review:
    name: SonarQube Agentic Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Essential for accurate blame and AI context (Gitar)

      - name: SonarQube Scan (with Gitar AI)
        id: sonar-scan
        # continue-on-error until secrets are configured by user
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarcloud.io"
        with:
          args: >
            -Dsonar.projectKey=IgorGanapolsky_AnswerGuard
            -Dsonar.organization=igorganapolsky
            -Dsonar.ai.verifyAgenticOutput=true
            -Dsonar.qualitygate.wait=true

      - name: SonarQube Quality Gate Check
        id: quality-gate
        if: steps.sonar-scan.outcome == 'success'
        uses: SonarSource/sonarqube-quality-gate-action@v1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
