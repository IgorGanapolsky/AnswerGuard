name: Resolve Bot Comments

on:
  schedule:
    # Was "*/30 * * * *" (1,440 runs/mo). The pull_request_target trigger
    # below catches the real cases; the cron is just a sweeper for missed
    # events. Every 6 hours is plenty.
    - cron: "0 */6 * * *"
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve Bot Comments
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/resolve_bot_comments.py
          python3 scripts/resolve_bot_comments.py
