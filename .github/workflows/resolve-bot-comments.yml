name: Resolve Bot Comments

on:
  # schedule:  # Disabled to optimize GitHub Actions budget
    # # Was "*/30 * * * *" (1,440 runs/mo). The pull_request_target trigger
    # # below catches the real cases; the cron is just a sweeper for missed
    # # events. Every 6 hours is plenty.
    # - cron: "0 */6 * * *"
  workflow_dispatch:
  # paths-ignore intentionally omitted: this workflow's purpose is comment
  # cleanup regardless of which files changed. Filtering by path would let
  # a doc-only push leave bot comments orphaned on the previous code push.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: resolve-bot-comments-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve Bot Comments
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/resolve_bot_comments.py
          python3 scripts/resolve_bot_comments.py
