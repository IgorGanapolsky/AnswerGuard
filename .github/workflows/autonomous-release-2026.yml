name: Autonomous Release 2026 (June Core)

on:
  workflow_dispatch:
    inputs:
      rollout:
        description: 'Rollout percentage (0.0 to 1.0)'
        required: true
        default: '0.1'

jobs:
  autonomous-flow:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install Pillow google-api-python-client google-auth

      - name: Generate Stellar Branding (June 2026)
        run: python3 scripts/stellar_brand_generator.py

      - name: Write Google Play key
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: |
          echo "$GOOGLE_PLAY_JSON_KEY" > "$RUNNER_TEMP/play-service-account.json"

      - name: Sync Metadata to Play Console
        env:
          GOOGLE_PLAY_JSON_KEY_PATH: ${{ runner.temp }}/play-service-account.json
        run: python3 scripts/sync_android_metadata.py

      - name: Autonomous Rollout Promotion
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: python3 scripts/autonomous_rollout_manager.py --rollout ${{ github.event.inputs.rollout }}

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/play-service-account.json"
