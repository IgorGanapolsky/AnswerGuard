name: Device Tests

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'native-android/**'
      - '.maestro/**'
      - 'scripts/device-tests/**'
      - '.github/workflows/device-tests.yml'
  workflow_dispatch:

concurrency:
  group: device-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-device-tests:
    name: Android Emulator + Maestro Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Create dummy google-services.json for CI
        working-directory: native-android
        run: |
          cat > app/google-services.json << 'GSEOF'
          {
            "project_info": { "project_number": "000000000000", "project_id": "answerguard-ci", "storage_bucket": "answerguard-ci.appspot.com" },
            "client": [{ "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": { "package_name": "com.igorganapolsky.answerguard" } }, "api_key": [{ "current_key": "CI_PLACEHOLDER" }] }],
            "configuration_version": "1"
          }
          GSEOF

      - name: Build debug APK
        working-directory: native-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-30-${{ runner.os }}

      - name: Run Maestro tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -skin 1080x2340
          disable-animations: false
          emulator-boot-timeout: 300
          script: |
            sh scripts/device-tests/ci-maestro.sh
            # Extended Maestro flows. Billing-related flows are CI-safe because
            # they accept both success and failure terminal states (Play Billing
            # is unavailable in CI). The role-onboarding cancel flow is kept
            # local-only because RoleOnboardingActivity bounces immediately on
            # emulators without telephony, making the Back press exit the app.
            export PATH="$HOME/.maestro/bin:$PATH"
            EXTENDED_FAIL=0
            for flow in \
              .maestro/home-content-render.yaml \
              .maestro/deep-link-open-home.yaml \
              .maestro/pro-upgrade-cancel-returns-home.yaml \
              .maestro/pro-upgrade-tap-shows-status.yaml \
              .maestro/pro-restore-no-purchase.yaml
            do
              echo "== Extended flow: $flow =="
              adb shell am force-stop com.igorganapolsky.answerguard 2>/dev/null || true
              sleep 2
              if maestro test "$flow"; then
                echo "PASSED: $flow"
              else
                echo "FAILED: $flow"
                EXTENDED_FAIL=$((EXTENDED_FAIL + 1))
              fi
            done
            [ "$EXTENDED_FAIL" -eq 0 ]
