<?xml version="1.0" encoding="UTF-8"?>
<!--
  AnswerGuard COMPOSED launcher icon — used for:
    • Play Store hi-res icon (512×512)
    • iOS marketing icon (1024×1024)
    • Legacy Android launcher (API < 26)
  2026 bold high-contrast design: full-bleed diagonal green/teal gradient
  background, ONE solid white shield, bold gradient check knocked into it.
  No glass, no alpha fills, no thin lines, no drop shadow.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15C39A"/>
      <stop offset="100%" stop-color="#0A7C5A"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed diagonal gradient background (OS applies rounded mask). -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>

  <!-- ONE solid white shield silhouette, ~64% of canvas height, centered. -->
  <path d="
    M 512 184
    L 819 264
    L 819 517
    C 819 685, 700 800, 512 840
    C 324 800, 205 685, 205 517
    L 205 264
    Z"
    fill="#FFFFFF"/>

  <!-- Bold check mark knocked out of the shield in the gradient color. -->
  <path d="
    M 372 512
    L 470 600
    L 660 392"
    fill="none"
    stroke="url(#bgGrad)"
    stroke-width="98"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
