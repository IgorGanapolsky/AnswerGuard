<?xml version="1.0" encoding="UTF-8"?>
<!--
  AnswerGuard composed launcher icon (FLAT, 2026).

  Source for Play Store, iOS App Store, and legacy Android launcher PNGs.
  Design: ONE bold white shield with a phone handset knocked out, on a gentle
  (low-contrast, 2-stop) teal->emerald vertical fill. Two colors total.
  NO gloss, NO radial glow, NO drop shadows, NO bevel/3D, NO decorative swoosh.

  The shipped PNGs are produced by scripts/stellar_brand_generator_v2.py
  (the canonical renderer); this SVG documents the same flat design.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15C39A"/>
      <stop offset="1" stop-color="#0E9E86"/>
    </linearGradient>
    <!-- Glyph mask: white shield with the phone handset knocked out (black). -->
    <mask id="glyph">
      <rect width="1024" height="1024" fill="black"/>
      <path d="M512 195 L819 320 L819 528 C819 698 700 808 512 890 C324 808 205 698 205 528 L205 320 Z"
            fill="white"/>
      <g fill="black" stroke="black" stroke-linecap="round" stroke-linejoin="round">
        <path d="M412 614 C436 678 520 690 575 632 C622 583 596 470 615 416"
              fill="none" stroke-width="96"/>
        <circle cx="412" cy="614" r="84"/>
        <circle cx="615" cy="416" r="84"/>
      </g>
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="#FFFFFF" mask="url(#glyph)"/>
</svg>
