<?xml version="1.0" encoding="UTF-8"?>
<!--
  AnswerGuard ADAPTIVE-ICON foreground layer for Android API 26+.
  Just the SOLID white shield + bold gradient check on a transparent
  canvas. Android composites this over the brand-gradient background
  drawable, then applies the launcher mask (squircle / circle / etc.).

  Content stays inside the centre ~66% safe zone (≈ x/y 174..850) so the
  mask never clips the shield apex. No glass, no alpha fills, no thin lines.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15C39A"/>
      <stop offset="100%" stop-color="#0A7C5A"/>
    </linearGradient>
  </defs>

  <!-- NO background rect — transparent so the adaptive background shows. -->

  <!-- Solid white shield sized within the 66% safe zone. -->
  <path d="
    M 512 300
    L 730 357
    L 730 537
    C 730 657, 645 738, 512 768
    C 379 738, 294 657, 294 537
    L 294 357
    Z"
    fill="#FFFFFF"/>

  <!-- Bold gradient check knocked into the shield. -->
  <path d="
    M 412 535
    L 482 598
    L 618 450"
    fill="none"
    stroke="url(#checkGrad)"
    stroke-width="70"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
