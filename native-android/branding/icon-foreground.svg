<?xml version="1.0" encoding="UTF-8"?>
<!--
  Android adaptive-icon FOREGROUND layer for AnswerGuard (FLAT, 2026).

  ONE flat white glyph (shield with a CHECKMARK knocked out) on a fully
  TRANSPARENT background. The glyph is inset so its content radius stays well
  inside the adaptive safe zone (content radius <= 0.60 of the layer half-size,
  comfortably inside the 0.66 safe circle) with a clear transparent margin ring
  on every launcher mask (circle / squircle / rounded-square).

  The shipped PNG is produced by scripts/stellar_brand_generator_v2.py
  (render_adaptive_foreground); this SVG documents the same flat design.
  NO gloss, NO glow, NO drop shadows, NO bevel/3D, NO decorative swoosh.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Glyph mask: white shield with a CHECKMARK knocked out (black). The
         check is a round-capped, round-joined stroked polyline (the classic
         tick: START -> low VERTEX -> high END), NOT a filled freeform blob. -->
    <mask id="glyph">
      <rect width="1024" height="1024" fill="black"/>
      <path d="M512 195 L819 320 L819 528 C819 698 700 808 512 890 C324 808 205 698 205 528 L205 320 Z"
            fill="white"/>
      <path d="M405 520 L480 605 L640 425"
            fill="none" stroke="black" stroke-width="70"
            stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>

  <!--
    INSET: scale the glyph about the canvas centre (512,512) to ~0.80 so the
    rendered content sits inside the ~0.58 content radius with a clear
    transparent margin on every adaptive mask shape.
  -->
  <g transform="translate(512 512) scale(0.80) translate(-512 -512)">
    <rect width="1024" height="1024" fill="#FFFFFF" mask="url(#glyph)"/>
  </g>
</svg>
