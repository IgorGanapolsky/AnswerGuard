<?xml version="1.0" encoding="UTF-8"?>
<!--
  AnswerGuard ADAPTIVE-ICON foreground layer for Android API 26+.
  Just the shield + phone motif on a transparent canvas. Android
  composites this over the brand-teal background colour defined in
  mipmap-anydpi-v26/ic_launcher.xml, then applies the launcher's
  mask (squircle / circle / teardrop / etc.).

  Visual content stays inside the centre 66% of the canvas (Android's
  documented safe zone) so the mask never clips the shield apex.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="shieldFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="55%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="shieldRim" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ECFEFF" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- NOTE: NO background rect — the canvas is transparent so the
       adaptive background drawable shows through. -->

  <path d="
    M 512 264
    L 760 326
    L 760 504
    C 760 632, 692 736, 512 792
    C 332 736, 264 632, 264 504
    L 264 326
    Z"
    fill="url(#shieldFill)"
    stroke="url(#shieldRim)"
    stroke-width="12"
    stroke-linejoin="round"/>

  <path d="
    M 312 340
    L 512 290
    L 712 340
    L 712 388
    C 712 388, 616 354, 512 354
    C 408 354, 312 388, 312 388
    Z"
    fill="#ECFEFF"
    opacity="0.30"/>

  <g transform="translate(512 520) rotate(-25) scale(16) translate(-12 -12)">
    <path d="
      M 19.23 15.26
      l -2.54 -0.29
      c -0.61 -0.07 -1.21 0.14 -1.64 0.57
      l -1.84 1.84
      c -2.83 -1.44 -5.15 -3.75 -6.59 -6.59
      l 1.85 -1.85
      c 0.43 -0.43 0.64 -1.03 0.57 -1.64
      l -0.29 -2.52
      C 8.62 3.77 7.77 3.01 6.75 3.01
      H 5.03
      C 3.9 3.01 2.96 3.95 3.03 5.08
      c 0.53 8.54 7.36 15.36 15.89 15.89
      c 1.13 0.07 2.07 -0.87 2.07 -2
      v -1.73
      c 0.01 -1.01 -0.75 -1.86 -1.76 -1.98 z"
      fill="#06211E"/>
  </g>
</svg>
