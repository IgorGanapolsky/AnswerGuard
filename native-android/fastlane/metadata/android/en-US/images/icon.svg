<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deep dark gradient background -->
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#0F2A28"/>
      <stop offset="55%" stop-color="#0B1518"/>
      <stop offset="100%" stop-color="#06090C"/>
    </radialGradient>

    <!-- Shield teal gradient (top-down) -->
    <linearGradient id="shieldFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="55%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>

    <!-- Outer rim highlight -->
    <linearGradient id="shieldRim" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Phone handset darker emerald (sits on bright shield) -->
    <linearGradient id="phoneFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#06211E"/>
    </linearGradient>

    <!-- Soft teal glow halo behind shield -->
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#2DD4BF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed background (Android adaptive icons get masked anyway) -->
  <rect width="1024" height="1024" fill="url(#bgGlow)"/>

  <!-- Halo behind shield -->
  <circle cx="512" cy="512" r="430" fill="url(#haloGlow)"/>

  <!-- ========== SHIELD ==========
       Classic heater/crest shield, sized to fit Android safe zone (~680px tall),
       centered at (512, 520). -->
  <g filter="url(#softGlow)">
    <!-- Shield body -->
    <path d="
      M 512 152
      L 818 232
      L 818 480
      C 818 642, 720 778, 512 868
      C 304 778, 206 642, 206 480
      L 206 232
      Z"
      fill="url(#shieldFill)"
      stroke="url(#shieldRim)"
      stroke-width="12"
      stroke-linejoin="round"/>

    <!-- Inner shield highlight (top arc, gives 3D feel) -->
    <path d="
      M 270 252
      L 512 188
      L 754 252
      L 754 320
      C 754 320, 640 280, 512 280
      C 384 280, 270 320, 270 320
      Z"
      fill="#A7F3D0"
      opacity="0.28"/>
  </g>

  <!-- ========== PHONE HANDSET ==========
       Classic Material-style telephone receiver, rotated -30° for dynamic
       motion. Sized to dominate the shield while staying inside the safe
       zone. Drawn in deep emerald so it reads as a cutout against the
       bright teal shield. -->
  <g transform="translate(512 520) rotate(-30) scale(20) translate(-12 -12)">
    <path d="
      M 19.23 15.26
      l -2.54 -0.29
      c -0.61 -0.07 -1.21 0.14 -1.64 0.57
      l -1.84 1.84
      c -2.83 -1.44 -5.15 -3.75 -6.59 -6.59
      l 1.85 -1.85
      c 0.43 -0.43 0.64 -1.03 0.57 -1.64
      l -0.29 -2.52
      C 8.62 3.77 7.77 3.01 6.75 3.01
      H 5.03
      C 3.9 3.01 2.96 3.95 3.03 5.08
      c 0.53 8.54 7.36 15.36 15.89 15.89
      c 1.13 0.07 2.07 -0.87 2.07 -2
      v -1.73
      c 0.01 -1.01 -0.75 -1.86 -1.76 -1.98 z"
      fill="url(#phoneFill)"
      stroke="#06211E"
      stroke-width="0.15"
      stroke-linejoin="round"/>
  </g>

  <!-- Subtle bottom shadow under shield -->
  <ellipse cx="512" cy="880" rx="220" ry="22" fill="#000000" opacity="0.4"/>
</svg>
