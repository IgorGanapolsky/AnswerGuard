<?xml version="1.0" encoding="UTF-8"?>
<!--
  AnswerGuard COMPOSED launcher icon — used for:
    • Play Store hi-res icon (512×512)
    • iOS marketing icon (1024×1024)
    • Legacy Android launcher (API < 26)
  Adaptive Android (API 26+) layers icon-foreground.svg over a solid
  teal background color so the launcher's squircle mask fills with the
  brand color instead of black margin.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0E4744"/>
      <stop offset="100%" stop-color="#06211E"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="55%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="shieldRim" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ECFEFF" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed brand-teal background. Fills the launcher mask with
       brand colour so there's no black margin around the shield. -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>

  <!-- Shield — sized to fill ~75% of canvas so it dominates the
       squircle mask. Stays within Android's 66% safe zone at the
       narrowest dimension; mask shows brand teal at the corners. -->
  <path d="
    M 512 208
    L 800 280
    L 800 488
    C 800 640, 712 768, 512 832
    C 312 768, 224 640, 224 488
    L 224 280
    Z"
    fill="url(#shieldFill)"
    stroke="url(#shieldRim)"
    stroke-width="14"
    stroke-linejoin="round"/>

  <!-- Top-arc highlight for 3D feel. -->
  <path d="
    M 280 296
    L 512 240
    L 744 296
    L 744 348
    C 744 348, 632 312, 512 312
    C 392 312, 280 348, 280 348
    Z"
    fill="#ECFEFF"
    opacity="0.30"/>

  <!-- Phone handset, rotated -25° for motion, centred on shield. -->
  <g transform="translate(512 520) rotate(-25) scale(18) translate(-12 -12)">
    <path d="
      M 19.23 15.26
      l -2.54 -0.29
      c -0.61 -0.07 -1.21 0.14 -1.64 0.57
      l -1.84 1.84
      c -2.83 -1.44 -5.15 -3.75 -6.59 -6.59
      l 1.85 -1.85
      c 0.43 -0.43 0.64 -1.03 0.57 -1.64
      l -0.29 -2.52
      C 8.62 3.77 7.77 3.01 6.75 3.01
      H 5.03
      C 3.9 3.01 2.96 3.95 3.03 5.08
      c 0.53 8.54 7.36 15.36 15.89 15.89
      c 1.13 0.07 2.07 -0.87 2.07 -2
      v -1.73
      c 0.01 -1.01 -0.75 -1.86 -1.76 -1.98 z"
      fill="#06211E"/>
  </g>
</svg>
