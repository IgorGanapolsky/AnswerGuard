appId: com.igorganapolsky.answerguard
---
# Verify the full Settings surface renders.
# Blocklist, Subscription, Privacy & Data, and the About sections (HowItWorks +
# PrivacyCard) all now live in the Settings screen behind the gear.
- launchApp:
    clearState: true
- runFlow: dismiss-popups.yaml
- extendedWaitUntil:
    visible: 'AnswerGuard'
    timeout: 30000
- assertVisible: 'AnswerGuard'
- assertVisible: 'Call Screening'

# Navigate to the Settings screen.
- tapOn: 'Settings'
- extendedWaitUntil:
    visible: 'Settings'
    timeout: 10000
- assertVisible: 'Settings'

# BLOCKLIST section
- scrollUntilVisible:
    element:
      text: 'Personal Blocklist'
    direction: DOWN
    timeout: 20000
- assertVisible: 'Personal Blocklist'

# SUBSCRIPTION section — tier card title varies by entitlement.
- scrollUntilVisible:
    element:
      text: 'AnswerGuard (Free|Pro|Family|Business)'
    direction: DOWN
    timeout: 20000

# DATA section
- scrollUntilVisible:
    element:
      text: 'Privacy & Data'
    direction: DOWN
    timeout: 20000
- assertVisible: 'Privacy & Data'

# ABOUT section — HowItWorks steps.
- scrollUntilVisible:
    element:
      text: 'How it works'
    direction: DOWN
    timeout: 20000
- assertVisible: 'How it works'
- assertVisible:
    text: '.*Enable AnswerGuard as your call screening app.*'
- assertVisible:
    text: '.*checked locally against confirmed spam patterns.*'
- assertVisible:
    text: '.*Unknown calls are allowed by default.*'

# ABOUT section — PrivacyCard.
- scrollUntilVisible:
    element:
      text: 'Privacy first'
    direction: DOWN
    timeout: 20000
- assertVisible: 'Privacy first'
- assertVisible:
    text: '.*does not upload your call history.*'
- assertVisible:
    text: 'Package: com.igorganapolsky.answerguard'

# Go back to Home
- tapOn: 'Back'
- extendedWaitUntil:
    visible: 'AnswerGuard'
    timeout: 10000
- assertVisible: 'AnswerGuard'
