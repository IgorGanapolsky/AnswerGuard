appId: com.igorganapolsky.answerguard
---
# Verify the full settings surface renders.
# Covers HowItWorks steps and PrivacyCard, which are in the Settings screen.
- launchApp:
    clearState: true
- runFlow: dismiss-popups.yaml
- extendedWaitUntil:
    visible: 'AnswerGuard'
    timeout: 30000
- assertVisible: 'AnswerGuard'
- assertVisible: 'Call Screening'
- assertVisible: 'AnswerGuard Pro'

# Navigate to Settings screen
- tapOn: 'Settings'
- extendedWaitUntil:
    visible: 'Settings & Info'
    timeout: 10000
- assertVisible: 'Settings & Info'

- scrollUntilVisible:
    element:
      text: 'How it works'
    direction: DOWN
    timeout: 20000

- assertVisible: 'How it works'
- assertVisible:
    text: '.*Enable AnswerGuard as your call screening app.*'
- assertVisible:
    text: '.*checked locally against confirmed spam patterns.*'
- assertVisible:
    text: '.*Unknown calls are allowed by default.*'

- scrollUntilVisible:
    element:
      text: 'Privacy first'
    direction: DOWN
    timeout: 20000

- assertVisible: 'Privacy first'
- assertVisible:
    text: '.*does not upload your call history.*'
- assertVisible:
    text: 'Package: com.igorganapolsky.answerguard'

# Go back to Home
- tapOn: 'Back'
- extendedWaitUntil:
    visible: 'AnswerGuard'
    timeout: 10000
- assertVisible: 'AnswerGuard'

