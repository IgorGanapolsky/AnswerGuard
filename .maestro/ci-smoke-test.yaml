appId: com.igorganapolsky.answerguard
---
# CI smoke test: launch AnswerGuard and verify the stable home surface.
- launchApp
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
        id: "status_title"
    timeout: 60000

- assertVisible:
    id: "home_title"
- assertVisible:
    id: "status_title"
- assertVisible:
    id: "pro_card_title"
