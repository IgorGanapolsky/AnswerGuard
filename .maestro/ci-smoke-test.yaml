appId: com.igorganapolsky.answerguard
---
# CI smoke test: launch AnswerGuard and verify the stable home surface.
- launchApp
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: 'Call Screening'
    timeout: 60000

- assertVisible: 'AnswerGuard'
- assertVisible: 'Call Screening'
- assertVisible: 'Enable Call Screening'
- assertVisible: '.*Pro.*'
