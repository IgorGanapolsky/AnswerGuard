appId: com.igorganapolsky.answerguard
---
# CI smoke test: launch AnswerGuard and verify the stable home surface.
- launchApp:
    clearState: true
- waitForAnimationToEnd

# Dismiss common emulator system popups if present
- runFlow:
    when:
      visible:
        text: ".*keeps stopping.*"
    commands:
      - tapOn: "Close app"
- runFlow:
    when:
      visible:
        text: ".*isn't responding.*"
    commands:
      - tapOn: "Close app"
- runFlow:
    when:
      visible: "Wait"
    commands:
      - tapOn: "Wait"

- extendedWaitUntil:
    visible: 'Call Screening'
    timeout: 60000

- assertVisible: 'AnswerGuard'
- assertVisible: 'Call Screening'
# "Enable Call Screening" renders only before the call-screening role is
# held; asserting it fails on any device that already has screening enabled.
# The Pro card sits below the fold once screening is active — scroll to it.
- scrollUntilVisible:
    element:
      text: '.*Pro.*'
    direction: DOWN
    timeout: 20000
