appId: com.igorganapolsky.answerguard
---
# Smoke test: verify AnswerGuard launches to the protection home screen.
# Asserts only the stable home surface present in BOTH the enabled and
# not-yet-enabled states. "Enable Call Screening" is intentionally not
# asserted here — it renders only before the call-screening role is held,
# so it is not a reliable signal on a configured device.
- launchApp
- waitForAnimationToEnd
- assertVisible: 'AnswerGuard'
- assertVisible: 'Call Screening'
# The subscription card sits below the fold once screening is active. Its title
# varies by entitlement (Free pre-purchase; Pro/Family/Business once entitled),
# so match any tier rather than hard-coding one.
- scrollUntilVisible:
    element:
      text: 'AnswerGuard (Free|Pro|Family|Business)'
    direction: DOWN
    timeout: 20000
