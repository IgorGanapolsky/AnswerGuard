appId: com.igorganapolsky.answerguard
---
# Target: AnswerGuard
- launchApp
- waitForAnimationToEnd
# The Personal Blocklist card sits below the fold on the home screen — scroll
# to it rather than asserting it is visible on the initial viewport.
- scrollUntilVisible:
    element:
      text: "Personal Blocklist"
    direction: DOWN
    timeout: 20000
- tapOn: "Manage Blocklist"
- assertVisible: "Your Blocklist"
- tapOn: "Enter number"
- inputText: "1234567890"
- tapOn: "Add"
- assertVisible: "1234567890"
# Tap the Remove button in the SAME row as the test number — the blocklist
# may already contain other entries, so an unscoped "Remove" tap is ambiguous.
- tapOn:
    text: "Remove"
    rightOf:
      text: "1234567890"
- assertNotVisible: "1234567890"
- tapOn: "Back"
# Confirm we left the blocklist screen. The home surface can be left
# mid-scroll, so assert the blocklist screen is gone rather than asserting
# a specific home header that may be scrolled out of view.
- assertNotVisible: "Your Blocklist"
