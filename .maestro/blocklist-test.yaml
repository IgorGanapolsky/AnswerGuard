appId: com.igorganapolsky.answerguard
---
# Target: AnswerGuard
# The Personal Blocklist now lives in the Settings screen (behind the gear),
# not on Home — open Settings first, then manage the blocklist there.
- launchApp
- waitForAnimationToEnd
- tapOn: "Settings"
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Personal Blocklist"
    direction: DOWN
    timeout: 20000
- tapOn: "Manage Blocklist"
- assertVisible: "Your Blocklist"
- tapOn: "Enter number"
- inputText: "1234567890"
- tapOn: "Add"
- assertVisible: "1234567890"
# Tap the Remove button in the SAME row as the test number — the blocklist
# may already contain other entries, so an unscoped "Remove" tap is ambiguous.
- tapOn:
    text: "Remove"
    rightOf:
      text: "1234567890"
- assertNotVisible: "1234567890"
# Dismiss the soft keyboard and let the UI settle before tapping Back —
# tapping during the post-input recomposition intermittently missed the target.
- hideKeyboard
- waitForAnimationToEnd
- tapOn: "Back"
# Back from the blocklist returns to Settings (its parent), not Home.
# Assert the blocklist screen is gone rather than a specific header that
# may be scrolled out of view.
- assertNotVisible: "Your Blocklist"
