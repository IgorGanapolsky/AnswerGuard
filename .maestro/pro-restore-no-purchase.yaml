appId: com.igorganapolsky.answerguard
---
# Verify Restore Purchases flow surfaces a status message and re-enables the
# button afterward. On CI (no Play Store account, no prior purchase) the
# expected terminal state is "No active Pro purchase" or a billing error.
- launchApp:
    clearState: true
- runFlow: dismiss-popups.yaml
- extendedWaitUntil:
    visible: 'AnswerGuard'
    timeout: 30000
- runFlow: open-settings-subscription.yaml

- assertVisible: 'Restore'
- tapOn: 'Restore'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: '.*(No active Pro purchase|Could not restore|Checking Google Play).*'
    timeout: 15000

- extendedWaitUntil:
    visible:
      text: '.*(No active Pro purchase|Could not restore|Pro purchase restored).*'
    timeout: 15000

- assertVisible: 'Upgrade'
- assertVisible: 'Restore'
