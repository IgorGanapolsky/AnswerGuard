appId: com.igorganapolsky.answerguard
---
# Test: AnswerGuard returns to the protection home screen after app switch.
- launchApp

- assertVisible: 'AnswerGuard'
- assertVisible: 'Call Screening'

# Background the app by pressing Home
- pressKey: Home

- runScript:
    script: |
      java.lang.Thread.sleep(3000)

# Return to the app
- launchApp

- assertVisible: 'AnswerGuard'
- assertVisible: 'Call Screening'
