appId: com.igorganapolsky.answerguard
---
# Verify Pro upgrade entry point: tapping Upgrade triggers a billing attempt
# and surfaces a user-visible status message. Real Play Billing is unavailable
# on CI emulators, so we accept either the "connecting" success path message
# or the "could not open" failure message — both prove the click handler ran
# and updated UI state. Test fails only if NO status text appears.
# TODO: needs testTag("pro_upgrade_button") and testTag("pro_status_message") for stable matching.
- launchApp:
    clearState: true
- runFlow: dismiss-popups.yaml
# Card title varies by tier (Free pre-purchase, Pro/Family/Business after);
# scroll into view since it sits below the activity list.
- extendedWaitUntil:
    visible: 'AnswerGuard'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: 'AnswerGuard (Free|Pro|Family|Business)'
    direction: DOWN
    timeout: 20000

- assertVisible: 'Upgrade'
- tapOn: 'Upgrade'
- waitForAnimationToEnd

# Now the Paywall Sheet is visible. Tap the "Start Business Plan" button on the sheet
# to trigger the real billing attempt.
- extendedWaitUntil:
    visible: '.*Start Business Plan.*'
    timeout: 10000
- tapOn: '.*Start Business Plan.*'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: '.*(Google Play|Could not open|Connecting|Could not start|Pro upgrade).*'
    timeout: 15000

- scrollUntilVisible:
    element:
      text: 'AnswerGuard (Free|Pro|Family|Business)'
    direction: DOWN
    timeout: 15000
- assertVisible: 'Upgrade'
