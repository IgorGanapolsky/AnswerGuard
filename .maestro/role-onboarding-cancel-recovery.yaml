appId: com.igorganapolsky.answerguard
---
# Role onboarding declined / cancelled path.
# Taps "Enable Call Screening", which launches the transparent RoleOnboardingActivity
# and then the system role-picker dialog. The user cancels (Back press), and the
# app must return to its home surface with the CTA still "Enable Call Screening"
# (i.e. role was NOT granted, status did not flip to "Active").
# TODO: needs testTag("enable_call_screening_button") and testTag("call_screening_status_text").
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'AnswerGuard'
    timeout: 30000

- assertVisible: 'Enable Call Screening'
- assertVisible: 'Not enabled'

- tapOn: 'Enable Call Screening'
- waitForAnimationToEnd

# System role dialog (or transparent activity bounce on emulators without
# the role available) — press Back to decline / dismiss.
- pressKey: Back
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: 'AnswerGuard'
    timeout: 15000

- assertVisible: 'Call Screening'
- assertVisible: 'Not enabled'
- assertVisible: 'Enable Call Screening'
