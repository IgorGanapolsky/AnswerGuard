# SonarQube / SonarCloud configuration for AnswerGuard
sonar.projectKey=IgorGanapolsky_AnswerGuard
sonar.organization=igorganapolsky
sonar.projectName=AnswerGuard

# Source and binary configuration
sonar.sources=.
sonar.exclusions=**/test/**,**/androidTest/**,**/*.js,**/node_modules/**
sonar.tests=.
sonar.test.inclusions=**/*Test.kt,**/*Test.swift,**/*Tests.swift,**/*Test.py

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# June 2026: Enable Agentic Analysis (Gitar integration)
sonar.ai.verifyAgenticOutput=true
sonar.ai.agenticLevel=high
